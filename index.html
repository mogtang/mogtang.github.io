<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>MTLab</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif;
      background: #111827;
      color: #fff;
    }
    header {
      padding: 14px 16px 10px;
      padding-top: max(14px, env(safe-area-inset-top));
    }
    h1 { margin: 0 0 10px; font-size: 20px; }
    .search {
      display: flex;
      gap: 8px;
    }
    input, button {
      min-height: 44px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
    }
    input {
      flex: 1;
      padding: 0 12px;
    }
    button {
      padding: 0 15px;
      background: #2563eb;
      color: #fff;
      font-weight: 700;
    }
    button:disabled { opacity: .5; }
    main { padding: 0 12px 20px; }
    .camera {
      position: relative;
      overflow: hidden;
      border-radius: 14px;
      background: #000;
      aspect-ratio: 3 / 4;
    }
    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #overlay {
      display: block;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #canvas { display: none; }
    .status {
      margin: 10px 2px;
      min-height: 22px;
      font-size: 14px;
      color: #d1d5db;
    }
    .result {
      padding: 12px;
      border-radius: 10px;
      background: #1f2937;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .match {
      margin-top: 8px;
      padding: 10px;
      border-left: 4px solid #facc15;
      background: #3f3f46;
    }
    .note {
      color: #9ca3af;
      font-size: 12px;
      line-height: 1.6;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <header>
    <h1>MTLab メニュー</h1>
  </header>

  <main>
    <div class="menu-wrapper">
      <ul>
        <li><a href="/lab/booksearch">BookSearch</a></li>
        <li><a href=""></a></li>
        <li><a href=""></a></li>
      </ul>
    </div>
  </main>
</body>
</html>
